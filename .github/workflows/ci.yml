name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: gateway, POSTGRES_PASSWORD: local, POSTGRES_DB: gateway}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gateway" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://gateway:local@localhost:5432/gateway
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:local@localhost:5432/gateway
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - run: bandit -r app -q
      - run: pip-audit -r requirements.lock
      - run: docker build -t ai-gateway:ci .
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-gateway:scan .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-gateway:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
